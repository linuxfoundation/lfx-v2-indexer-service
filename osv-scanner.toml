# osv-scanner configuration — https://google.github.io/osv-scanner/configuration/

# Scan the build toolchain, not go.mod's older minimum retained for MegaLinter's
# bundled compiler. Keep this aligned with .go-version and the toolchain directive;
# scripts/check-go-toolchain.sh verifies both configuration and the actual compiler.
GoVersionOverride = "1.26.10"

[[IgnoredVulns]]
id = "GO-2026-5932"
reason = "golang.org/x/crypto/openpgp is deprecated/unmaintained; the service does not use the openpgp package, and no fixed version is available"
