{{- if .Values.networkPolicy.enabled }}
{{- $policy := .Values.networkPolicy }}
{{- if empty $policy.opensearchPorts }}{{ fail "networkPolicy.opensearchPorts must not be empty" }}{{- end }}
{{- /* A blank port renders "port:" with no value, which allows every TCP port. */}}
{{- range $i, $port := $policy.opensearchPorts }}
{{- if or (empty $port) (empty (trim (toString $port))) }}{{ fail (printf "networkPolicy.opensearchPorts[%d] must be a port" $i) }}{{- end }}
{{- end }}
{{- range $key := list "natsPort" "heimdallJWKSPort" "otelGRPCPort" "otelHTTPPort" "valkeyPort" }}
{{- $port := index $policy $key }}
{{- if or (empty $port) (empty (trim (toString $port))) }}{{ fail (printf "networkPolicy.%s must be a port" $key) }}{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lfx-v2-indexer-service
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: lfx-v2-indexer-service
  policyTypes:
    - Egress
  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # NATS
    - ports:
        - port: {{ .Values.networkPolicy.natsPort }}
          protocol: TCP
    # OpenSearch
    - ports:
        {{- range .Values.networkPolicy.opensearchPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
    # Heimdall JWKS endpoint for JWT verification
    - ports:
        - port: {{ .Values.networkPolicy.heimdallJWKSPort }}
          protocol: TCP
    # OpenTelemetry collector (gRPC and HTTP)
    - ports:
        - port: {{ .Values.networkPolicy.otelGRPCPort }}
          protocol: TCP
        - port: {{ .Values.networkPolicy.otelHTTPPort }}
          protocol: TCP
    # Valkey index cache. Port-based egress does not stop pods without a
    # policy from reaching it.
    - ports:
        - port: {{ .Values.networkPolicy.valkeyPort }}
          protocol: TCP
{{- end }}
