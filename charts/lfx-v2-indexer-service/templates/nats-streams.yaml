---
{{- if .Values.nats.stream_index_events.creation }}
apiVersion: jetstream.nats.io/v1beta2
kind: Stream
metadata:
  name: index-events
  namespace: {{ .Release.Namespace }}
  {{- if .Values.nats.stream_index_events.keep }}
  annotations:
    "helm.sh/resource-policy": keep
  {{- end }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
spec:
  # Stream name must match constants.StreamNameIndexEvents in the application.
  # Do not make this configurable — a mismatch causes the consumer to fail at startup.
  name: index-events
  subjects:
    # Mirror the application subject settings so a single values override
    # keeps the stream and the consumer filter in sync.
    - {{ .Values.nats.indexingSubject }}
    - {{ .Values.nats.v1IndexingSubject }}
  retention: {{ .Values.nats.stream_index_events.retention }}
  maxAge: {{ .Values.nats.stream_index_events.maxAge }}
  maxBytes: {{ .Values.nats.stream_index_events.maxBytes }}
  maxMsgs: {{ .Values.nats.stream_index_events.maxMsgs }}
  storage: {{ .Values.nats.stream_index_events.storage }}
  replicas: {{ .Values.nats.stream_index_events.replicas }}
  compression: {{ .Values.nats.stream_index_events.compression }}
{{- end }}
