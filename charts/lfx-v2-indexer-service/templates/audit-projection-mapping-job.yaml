{{- if .Values.opensearch.auditProjectionMappingJob.enabled }}
{{- $job := .Values.opensearch.indexingJob }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-audit-mapping" .Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "2"
spec:
  ttlSecondsAfterFinished: {{ $job.ttlSecondsAfterFinished }}
  backoffLimit: {{ $job.backoffLimit }}
  {{- if $job.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ $job.activeDeadlineSeconds }}
  {{- end }}
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: {{ $job.restartPolicy }}
      containers:
        - name: update-audit-mapping
          image: {{ $job.image.repository }}:{{ $job.image.tag }}
          imagePullPolicy: {{ $job.image.pullPolicy }}
          {{- with $job.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.opensearch.auth.enabled }}
          {{- $secretName := required "opensearch.auth.provisioningSecret is required for audited projection mapping setup" .Values.opensearch.auth.provisioningSecret }}
          env:
            - name: OPENSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: username
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: password
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
          command:
            - sh
            - -c
            - |
              set -eu
              echo '{{ .Files.Get "files/opensearch-audit-projection-mapping.json" | b64enc }}' | base64 -d > /tmp/audit-mapping.json
              URL="{{ .Values.opensearch.url | trimSuffix "/" }}/{{ .Values.opensearch.index }}"
              for i in $(seq 1 15); do
                CODE=$(curl -s --connect-timeout 5 --max-time 5 -o /dev/null -w '%{http_code}' {{ if .Values.opensearch.auth.enabled }}-u "${OPENSEARCH_USERNAME}:${OPENSEARCH_PASSWORD}" {{ end }}--head "${URL}") || CODE=000
                if [ "${CODE}" = '200' ]; then
                  break
                fi
                sleep 5
              done
              if [ "${CODE}" != '200' ]; then
                echo "Current-resource index unavailable (HTTP ${CODE})"
                exit 1
              fi
              curl -sf --connect-timeout 5 --max-time 30 {{ if .Values.opensearch.auth.enabled }}-u "${OPENSEARCH_USERNAME}:${OPENSEARCH_PASSWORD}" {{ end }}-X PUT "${URL}/_mapping" -H 'Content-Type: application/json' --data-binary @/tmp/audit-mapping.json > /dev/null
              echo 'Applied internal audited projection mapping'
{{- end }}
