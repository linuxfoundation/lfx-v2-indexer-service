{{- if .Values.opensearch.indexingJob.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-opensearch-index-config
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    # Deliberately omits hook-succeeded: Helm can consider a non-Job hook
    # resource like this ConfigMap "succeeded" as soon as it's created, and
    # would delete it immediately, racing the hook Job (weight 1) that still
    # needs to mount it. before-hook-creation is enough to clean up the prior
    # release's ConfigMap before this one is (re)created.
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "0"
data:
  resources-index.json: |
{{- tpl (.Files.Get "files/opensearch-resources-index.json") . | nindent 4 }}
{{- end }}
