{{- if .Values.opensearch.indexingJob.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lfx-v2-indexer-service.indexConfigMapName" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # A pre-install/pre-upgrade hook, same as the index-setup Job it feeds
    # (see job.yaml): the Job must run before any normal resource (the
    # Deployment) exists, so OpenSearch never auto-creates the index without
    # the intended mappings. Hooks in the same phase run in ascending
    # hook-weight order with no weight defaulting to 0, so this ConfigMap
    # (unweighted) is guaranteed to be applied before the Job (weight 1).
    #
    # Delete policy is intentionally NOT hook-succeeded: unlike a Job/Pod, a
    # ConfigMap has no success/failure state for Helm to wait on, so it is
    # considered "succeeded" immediately upon creation. Adding
    # hook-succeeded here would delete the ConfigMap right after it's
    # created -- before the weight-1 Job hook even starts -- removing the
    # volume the Job mounts it as. before-hook-creation is sufficient: it
    # still cleans up the previous run's ConfigMap on the next install/
    # upgrade.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  resources-index.json: |
{{- tpl (.Files.Get "files/opensearch-resources-index.json.tpl") . | nindent 4 }}
{{- end }}
