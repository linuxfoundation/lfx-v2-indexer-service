{{- if .Values.opensearch.indexingJob.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-opensearch-index-config
  namespace: {{ .Release.Namespace }}
  # Deliberately a normal, release-managed resource rather than a hook
  # resource: Helm applies all normal resources before running any hooks, so
  # this ConfigMap is guaranteed to exist before the post-install/post-upgrade
  # index-setup Job (weight 1) mounts it, without needing hook annotations of
  # its own. Being release-managed also means `helm uninstall` removes it,
  # which a hook-only resource (no matching pre/post-delete hook) would not.
data:
  resources-index.json: |
{{- tpl (.Files.Get "files/opensearch-resources-index.json") . | nindent 4 }}
{{- end }}
