{{- if .Values.opensearch.indexingJob.enabled }}
{{- $job := .Values.opensearch.indexingJob }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "lfx-v2-indexer-service.indexJobName" . }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "1"
spec:
  ttlSecondsAfterFinished: {{ $job.ttlSecondsAfterFinished }}
  backoffLimit: {{ $job.backoffLimit }}
  {{- if $job.activeDeadlineSeconds }}
  activeDeadlineSeconds: {{ $job.activeDeadlineSeconds }}
  {{- end }}
  template:
    spec:
      restartPolicy: {{ $job.restartPolicy }}
      volumes:
        - name: index-config
          configMap:
            name: {{ include "lfx-v2-indexer-service.indexConfigMapName" . }}
      containers:
        - name: curl
          image: {{ $job.image.repository }}:{{ $job.image.tag }}
          imagePullPolicy: {{ $job.image.pullPolicy }}
          {{- with $job.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.opensearch.auth.enabled }}
          {{- $secretName := required "opensearch.auth.existingSecret is required when opensearch.auth.enabled is true" .Values.opensearch.auth.existingSecret }}
          env:
            - name: OPENSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: username
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: password
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: index-config
              mountPath: /config
              readOnly: true
          command:
            - sh
            - -c
            - |
              set -e
              OPENSEARCH_URL="{{ .Values.opensearch.url | trimSuffix "/" }}"
              INDEX_NAME="{{ .Values.opensearch.index }}"

              # The pre-install/pre-upgrade hook fires once the Job manifest is
              # applied, not once OpenSearch is actually accepting connections, so
              # wait for it to answer before checking/creating the index.
              for i in $(seq 1 30); do
                curl -sf -o /dev/null {{ if .Values.opensearch.auth.enabled }}-u "${OPENSEARCH_USERNAME}:${OPENSEARCH_PASSWORD}" {{ end }}"${OPENSEARCH_URL}/" && break
                echo "waiting for opensearch at ${OPENSEARCH_URL} (${i}/30)"
                sleep 5
              done

              # Check if index already exists
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" {{ if .Values.opensearch.auth.enabled }}-u "${OPENSEARCH_USERNAME}:${OPENSEARCH_PASSWORD}" {{ end }}--head "${OPENSEARCH_URL}/${INDEX_NAME}")

              if [ "$HTTP_CODE" = "200" ]; then
                echo "Index '${INDEX_NAME}' already exists, skipping creation"
                exit 0
              elif [ "$HTTP_CODE" = "404" ]; then
                echo "Index '${INDEX_NAME}' does not exist, creating..."
                curl -f {{ if .Values.opensearch.auth.enabled }}-u "${OPENSEARCH_USERNAME}:${OPENSEARCH_PASSWORD}" {{ end }}-X PUT "${OPENSEARCH_URL}/${INDEX_NAME}" \
                  -H 'Content-Type: application/json' \
                  -d @/config/resources-index.json
                echo "Index '${INDEX_NAME}' created successfully"
              else
                echo "Unexpected response checking index: HTTP ${HTTP_CODE}"
                exit 1
              fi
{{- end }}
