{{- /*
nats.drainTimeout is rendered verbatim into NATS_DRAIN_TIMEOUT and parsed
Go-side with time.ParseDuration, which accepts combinations of integer h/m/s/ms
components (e.g. "55s", "1m", "90000ms", "1m30s"). The grace-period check below
needs that value in whole seconds, so it's decomposed component-by-component
(ms extracted and stripped first, since "m" would otherwise also match the
"m" in "ms" — Go's RE2 regexp engine has no lookahead to disambiguate them
in a single pass) rather than requiring a single-unit "<N>s" string, which
would reject those other equally valid overrides.
*/}}
{{- $drainTimeout := .Values.nats.drainTimeout }}
{{- $durationPattern := "^([0-9]+h)?([0-9]+m)?([0-9]+s)?([0-9]+ms)?$" }}
{{- $durationError := printf "nats.drainTimeout %q must be a duration composed of integer h/m/s/ms components (e.g. \"55s\", \"1m\", \"90000ms\", \"1m30s\") for the terminationGracePeriodSeconds check below" $drainTimeout }}
{{- if or (eq $drainTimeout "") (not (regexMatch $durationPattern $drainTimeout)) }}
{{- fail $durationError }}
{{- end }}
{{- $msPart := regexFind "[0-9]+ms" $drainTimeout }}
{{- $remainder := regexReplaceAll "[0-9]+ms" $drainTimeout "" }}
{{- $hPart := regexFind "[0-9]+h" $remainder }}
{{- $mPart := regexFind "[0-9]+m" $remainder }}
{{- $sPart := regexFind "[0-9]+s" $remainder }}
{{- $matchedLen := add (add (add (len $hPart) (len $mPart)) (len $sPart)) (len $msPart) }}
{{- if ne $matchedLen (len $drainTimeout) }}
{{- fail $durationError }}
{{- end }}
{{- /*
addf, not add, below: add() coerces both operands to int64 before summing,
which would silently truncate the ms-derived fractional seconds to 0 before
ceil ever ran, making e.g. "55999ms" evaluate as 55s instead of 56s.
*/}}
{{- $drainSecondsFloat := 0.0 }}
{{- if $hPart }}{{- $drainSecondsFloat = addf $drainSecondsFloat (mulf ($hPart | trimSuffix "h" | float64) 3600.0) }}{{- end }}
{{- if $mPart }}{{- $drainSecondsFloat = addf $drainSecondsFloat (mulf ($mPart | trimSuffix "m" | float64) 60.0) }}{{- end }}
{{- if $sPart }}{{- $drainSecondsFloat = addf $drainSecondsFloat ($sPart | trimSuffix "s" | float64) }}{{- end }}
{{- if $msPart }}{{- $drainSecondsFloat = addf $drainSecondsFloat (divf ($msPart | trimSuffix "ms" | float64) 1000.0) }}{{- end }}
{{- $drainSeconds := ceil $drainSecondsFloat | int }}
{{- $minGracePeriod := add $drainSeconds 5 }}
{{- if lt (int .Values.app.terminationGracePeriodSeconds) $minGracePeriod }}
{{- fail (printf "app.terminationGracePeriodSeconds (%d) must be at least nats.drainTimeout (%s) + 5s margin for the health server's own shutdown delay (= %ds), or the pod is SIGKILLed mid-drain before DrainWithTimeout returns" (int .Values.app.terminationGracePeriodSeconds) $drainTimeout $minGracePeriod) }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lfx-v2-indexer-service
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ .Values.app.replicas }}
  # maxSurge: 0 / maxUnavailable: 100% eliminates the overlap window between
  # old core-NATS pods and new JetStream pods during the migration: all old
  # pods terminate before any new pod starts, preventing the same message
  # from being processed twice and emitting duplicate domain events.
  # TODO: revert to the default rollingUpdate values (maxSurge: 25%,
  # maxUnavailable: 25%) once the JetStream migration is complete and no
  # pre-JetStream release will be rolled back through this chart.
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: "100%"
  selector:
    matchLabels:
      app: lfx-v2-indexer-service
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: lfx-v2-indexer-service
        app.kubernetes.io/name: {{ .Chart.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.app.terminationGracePeriodSeconds }}
      containers:
        - name: app
          image: {{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: NATS_URL
              value: {{ .Values.nats.url }}
            - name: NATS_MAX_RECONNECTS
              value: {{ .Values.nats.maxReconnects | quote }}
            - name: NATS_RECONNECT_WAIT
              value: {{ .Values.nats.reconnectWait }}
            - name: NATS_CONNECTION_TIMEOUT
              value: {{ .Values.nats.connectionTimeout }}
            - name: NATS_INDEXING_SUBJECT
              value: {{ .Values.nats.indexingSubject }}
            - name: NATS_V1_INDEXING_SUBJECT
              value: {{ .Values.nats.v1IndexingSubject }}
            - name: NATS_QUEUE
              value: {{ .Values.messaging.queue }}
            - name: NATS_DRAIN_TIMEOUT
              value: {{ .Values.nats.drainTimeout }}
            - name: NATS_ACK_WAIT
              value: {{ .Values.nats.ackWait }}
            - name: NATS_WORKER_COUNT
              value: {{ .Values.nats.workerCount | quote }}
            - name: NATS_MAX_ACK_PENDING
              value: {{ .Values.nats.maxAckPending | quote }}
            - name: NATS_PENDING_MSG_LIMIT
              value: {{ .Values.nats.pendingMsgLimit | quote }}
            - name: NATS_PENDING_BYTES_LIMIT
              value: {{ .Values.nats.pendingBytesLimit | quote }}
            - name: OPENSEARCH_URL
              value: {{ .Values.opensearch.url }}
            - name: OPENSEARCH_INDEX
              value: {{ .Values.opensearch.index }}
            - name: OPENSEARCH_TIMEOUT
              value: {{ .Values.opensearch.timeout }}
            - name: OPENSEARCH_BATCH_MAX_SIZE
              value: {{ .Values.opensearch.batchMaxSize | quote }}
            - name: OPENSEARCH_BATCH_MAX_WAIT
              value: {{ .Values.opensearch.batchMaxWait }}
            - name: JWKS_URL
              value: {{ .Values.heimdall.jwksUrl }}
            - name: JWT_ISSUER
              value: {{ .Values.jwt.issuer }}
            - name: JWT_AUDIENCES
              value: {{ .Values.jwt.audiences | join "," }}
            - name: JWT_CLOCK_SKEW
              value: {{ .Values.jwt.clockSkew }}
            - name: PORT
              value: {{ .Values.app.port | quote }}
            - name: READ_TIMEOUT
              value: {{ .Values.app.readTimeout }}
            - name: WRITE_TIMEOUT
              value: {{ .Values.app.writeTimeout }}
            - name: SHUTDOWN_TIMEOUT
              value: {{ .Values.app.shutdownTimeout }}
            - name: LOG_LEVEL
              value: {{ .Values.app.logLevel }}
            - name: LOG_FORMAT
              value: {{ .Values.app.logFormat }}
            - name: JANITOR_ENABLED
              value: {{ .Values.janitor.enabled | quote }}
            - name: HEALTH_CHECK_TIMEOUT
              value: {{ .Values.health.checkTimeout }}
            - name: HEALTH_CACHE_DURATION
              value: {{ .Values.health.cacheDuration }}
            - name: HEALTH_DETAILED_RESPONSE
              value: {{ .Values.health.enableDetailedResponse | quote }}
            {{- with .Values.app.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- $otelServiceName := .Values.app.otel.serviceName | toString | trim }}
            {{- if ne $otelServiceName "" }}
            - name: OTEL_SERVICE_NAME
              value: {{ $otelServiceName | quote }}
            {{- end }}
            {{- $otelServiceVersion := .Values.app.otel.serviceVersion | toString | trim }}
            {{- if ne $otelServiceVersion "" }}
            - name: OTEL_SERVICE_VERSION
              value: {{ $otelServiceVersion | quote }}
            {{- end }}
            {{- $otelEndpoint := .Values.app.otel.endpoint | toString | trim }}
            {{- if ne $otelEndpoint "" }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $otelEndpoint | quote }}
            {{- end }}
            {{- $otelProtocol := .Values.app.otel.protocol | toString | trim }}
            {{- if ne $otelProtocol "" }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ $otelProtocol | quote }}
            {{- end }}
            {{- $otelInsecure := .Values.app.otel.insecure | toString | trim }}
            {{- if ne $otelInsecure "" }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: {{ $otelInsecure | quote }}
            {{- end }}
            {{- $otelTracesExporter := .Values.app.otel.tracesExporter | toString | trim }}
            {{- if ne $otelTracesExporter "" }}
            - name: OTEL_TRACES_EXPORTER
              value: {{ $otelTracesExporter | quote }}
            {{- end }}
            {{- $otelTracesSampler := .Values.app.otel.tracesSampler | toString | trim }}
            {{- if ne $otelTracesSampler "" }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ $otelTracesSampler | quote }}
            {{- end }}
            {{- $otelTracesSamplerArg := .Values.app.otel.tracesSamplerArg | toString | trim }}
            {{- if ne $otelTracesSamplerArg "" }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ $otelTracesSamplerArg | quote }}
            {{- end }}
            {{- $otelMetricsExporter := .Values.app.otel.metricsExporter | toString | trim }}
            {{- if ne $otelMetricsExporter "" }}
            - name: OTEL_METRICS_EXPORTER
              value: {{ $otelMetricsExporter | quote }}
            {{- end }}
            {{- $otelLogsExporter := .Values.app.otel.logsExporter | toString | trim }}
            {{- if ne $otelLogsExporter "" }}
            - name: OTEL_LOGS_EXPORTER
              value: {{ $otelLogsExporter | quote }}
            {{- end }}
            {{- $otelPropagators := .Values.app.otel.propagators | toString | trim }}
            {{- if ne $otelPropagators "" }}
            - name: OTEL_PROPAGATORS
              value: {{ $otelPropagators | quote }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.app.port }}
              name: web
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /livez
              port: web
            failureThreshold: 3
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: web
            failureThreshold: 1
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /readyz
              port: web
            failureThreshold: 30
            periodSeconds: 1
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
