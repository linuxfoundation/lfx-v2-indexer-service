---
name: "Indexer Service Build"

"on":
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  build-pr:
    name: Build and Test
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch@sha256:e96cc6ae1500a073d973c0906f30f7cf4d9c461f32f855f9242a2da933660cdd # 2.19.3
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Setup go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version-file: .go-version

      - name: Verify build and scanner toolchain
        run: make check-toolchain

      - name: Setup Helm for chart regression tests
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112  # v4.3.0
        with:
          version: v3.19.0

      - name: Download Dependencies
        run: make deps

      - name: Build
        run: make build

      - name: Test
        run: make test
        env:
          TEST_OPENSEARCH_URL: http://127.0.0.1:9200
          TEST_OPENSEARCH_ISOLATED: "true"

      - name: Repeat audit concurrency integration tests
        run: go test -v -race -count=3 -timeout=3m -run '^TestAuditOpenSearch_Concurrent' ./internal/infrastructure/storage
        env:
          TEST_OPENSEARCH_URL: http://127.0.0.1:9200
          TEST_OPENSEARCH_ISOLATED: "true"
